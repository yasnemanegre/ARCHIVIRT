# =============================================================================
# ARCHIVIRT — Telegraf configuration for the MANAGER VM (system metrics)
# Deployed by ansible/roles/manager. No secret in this file: INFLUX_TOKEN and
# INFLUX_URL are read from /etc/default/telegraf (written by Ansible from the
# vault, mode 0640 root:telegraf).
# Canonical target: org "archivirt", bucket "archivirt" (see
# ansible/inventory/group_vars/all/monitoring.yml).
# The monitor-ids configuration is monitoring/telegraf-monitor.conf.
# =============================================================================

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "archivirt-manager"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "archivirt"
  bucket = "archivirt"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]
  interfaces = ["ens3", "ens4"]

[[inputs.system]]
