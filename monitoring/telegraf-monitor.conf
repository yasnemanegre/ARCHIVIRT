# ARCHIVIRT — Telegraf configuration for MONITOR-IDS. No secret in this file:
# INFLUX_TOKEN / INFLUX_URL come from /etc/default/telegraf (Ansible, from the vault).
# INFLUX_URL = http://10.0.3.254:8086 (manager on ovs-monitor). Bucket: archivirt.
# ─────────────────────────────────────────────────────────────
# ARCHIVIRT — Telegraf Configuration for monitor-ids VM
# Collects IDS metrics (Snort3 + Suricata) → InfluxDB on manager
# ─────────────────────────────────────────────────────────────
[agent]
  interval = "10s"
  round_interval = true
  hostname = "archivirt-monitor-ids"

# ── Output: InfluxDB 2.x on manager ──────────────────────────
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "archivirt"
  bucket = "archivirt"

# ── CPU/RAM/Net ───────────────────────────────────────────────
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false

[[inputs.mem]]

# All monitor NICs: ens3 management, ens4/ens5 IPS egress/ingress, ens6/ens7 IDS
# capture (DOWN outside IDS campaigns: counters stay flat).
[[inputs.net]]
  interfaces = ["ens3", "ens4", "ens5", "ens6", "ens7"]

# ── Snort3 process ────────────────────────────────────────────
[[inputs.procstat]]
  # MANDAT 2026-10-20: anchored on the command line (pgrep -f); "snort" also matched helpers such as cat/grep on snort logs
  pattern = "^(/usr/local/bin/)?snort "
  tag_with = ["pid"]

# ── Suricata process ──────────────────────────────────────────
[[inputs.procstat]]
  # MANDAT 2026-10-20: anchored; "suricata" matched "cat /var/log/suricata/fast.log" of the alert counter
  pattern = "^(/usr/bin/)?suricata "
  tag_with = ["pid"]

# ── IDS alert counters ───────────────────────────────────────
# One point per engine, only when its alert file exists and is readable
# (/var/log/suricata/fast.log, /var/log/snort3/*/alert_fast.txt); no file ->
# no metric. Script deployed by ansible/playbooks/deploy_telegraf.yml.
# (Removed: eve.json tail — one InfluxDB point per Suricata event, unused by the
#  dashboard, heavy during campaigns; ips_metrics.json exec — legacy enforcer
#  file, absent, parse error every interval.)
[[inputs.exec]]
  commands = [["/usr/local/lib/archivirt/telegraf-alert-counts.sh"]]   # one argv array per command (Telegraf >= 1.39)
  timeout = "5s"
  data_format = "influx"
