---
# =============================================================================
# ARCHIVIRT - Initialize / verify InfluxDB v2 on manager
# Values: ansible/inventory/group_vars/all/monitoring.yml (org, bucket, URL)
#         ansible/inventory/group_vars/all/vault.yml     (token, admin password)
# Usage:  ansible-playbook ansible/playbooks/setup_influxdb.yml \
#           --vault-password-file ~/.archivirt/vault_pass
# Note:   the manager role already performs these steps; this playbook is kept
#         for re-initialisation / verification only.
# =============================================================================
- name: ARCHIVIRT - Initialize InfluxDB v2 on manager
  hosts: archivirt-manager
  become: yes

  tasks:
    - name: Ensure InfluxDB is running
      systemd:
        name: influxdb
        state: started
        enabled: yes

    - name: Wait for InfluxDB API
      uri:
        url: "{{ influx_url_local }}/health"
        status_code: 200
      register: influx_health
      retries: 20
      delay: 3
      until: influx_health.status == 200

    - name: Query onboarding state
      uri:
        url: "{{ influx_url_local }}/api/v2/setup"
        method: GET
        return_content: yes
      register: setup_check
      changed_when: false

    - name: Initialize InfluxDB via API (first time only)
      uri:
        url: "{{ influx_url_local }}/api/v2/setup"
        method: POST
        body_format: json
        body:
          username: "{{ influx_admin_user }}"
          password: "{{ influx_admin_password }}"
          org: "{{ influx_org }}"
          bucket: "{{ influx_bucket }}"
          token: "{{ influx_token }}"
          retentionPeriodSeconds: 0
        status_code: 201
      when: setup_check.json.allowed | bool
      no_log: true
      changed_when: true

    - name: Verify token, org and bucket
      uri:
        url: "{{ influx_url_local }}/api/v2/buckets?org={{ influx_org }}&name={{ influx_bucket }}"
        headers:
          Authorization: "Token {{ influx_token }}"
        status_code: 200
        return_content: yes
      register: buckets
      no_log: true
      failed_when: buckets.status != 200 or (buckets.json.buckets | length) != 1
      changed_when: false

    - name: Show result
      debug:
        msg: "InfluxDB ready: org={{ influx_org }} bucket={{ influx_bucket }} (token verified)"
