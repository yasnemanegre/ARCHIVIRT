# =============================================================================
# ARCHIVIRT - OVS Bridge Setup on Host
# =============================================================================
# Author  : Yasnemanegre SAWADOGO (SPbGUPTD)
# License : MIT — https://github.com/yasnemanegre/ARCHIVIRT
# Version : 1.1.0 — 2026-06-13
#
# Creates OVS bridges on the host AND installs systemd services so that
# bridges + DHCP survive host reboots without any manual intervention.
#
# Usage:
#   ansible-playbook ansible/playbooks/setup_ovs.yml \
#     -i ansible/inventory/hosts.ini
#
# Run order:
#   1. ansible-playbook setup_ovs.yml        ← this playbook (once, or after host reboot)
#   2. terraform apply                        ← deploy VMs
#   3. ansible-playbook run_all_scenarios.yml ← run campaigns
#
# After this playbook runs once, rebooting the host will automatically:
#   - Restore OVS bridge IPs  (archivirt-ovs-ip.service)
#   - Start dnsmasq DHCP      (archivirt-ovs-dhcp.service)
# =============================================================================
- name: ARCHIVIRT - Create OVS bridges on host (with persistent systemd)
  hosts: localhost
  connection: local
  become: yes
  gather_facts: no

  vars:
    ovs_bridges:
      - name: ovs-targets
        ip:   "10.0.2.1/24"
        dhcp_range: "10.0.2.10,10.0.2.50,12h"
      - name: ovs-monitor
        ip:   "10.0.3.1/24"
        dhcp_range: "10.0.3.10,10.0.3.50,12h"
      - name: ovs-attack
        ip:   "10.0.4.1/24"
        dhcp_range: "10.0.4.10,10.0.4.50,12h"
      - name: ovs-manager
        ip:   "10.0.5.1/24"
        dhcp_range: "10.0.5.10,10.0.5.50,12h"

  tasks:

    # -------------------------------------------------------------------------
    # 1. OVS operational check
    # -------------------------------------------------------------------------
    - name: Ensure openvswitch-switch is running
      systemd:
        name: openvswitch-switch
        state: started
        enabled: yes

    - name: Verify OVS is operational
      command: ovs-vsctl show
      register: ovs_status
      changed_when: false

    # -------------------------------------------------------------------------
    # 2. Create bridges + assign IPs (runtime, immediate)
    # -------------------------------------------------------------------------
    - name: Create OVS bridges (idempotent)
      command: "ovs-vsctl --may-exist add-br {{ item.name }}"
      loop: "{{ ovs_bridges }}"

    - name: Assign gateway IPs to OVS bridges
      command: "ip addr replace {{ item.ip }} dev {{ item.name }}"
      loop: "{{ ovs_bridges }}"
      ignore_errors: yes

    - name: Bring up OVS bridge interfaces
      command: "ip link set {{ item.name }} up"
      loop: "{{ ovs_bridges }}"

    # -------------------------------------------------------------------------
    # 3. Persist bridge IPs across reboots (systemd service)
    # -------------------------------------------------------------------------
    - name: Create OVS bridge IP setup script
      copy:
        dest: /usr/local/bin/archivirt-ovs-ip.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # ARCHIVIRT - Restore OVS bridge IPs after host reboot
          # Generated by setup_ovs.yml v1.1.0
          set -e
          {% for bridge in ovs_bridges %}
          ovs-vsctl --may-exist add-br {{ bridge.name }}
          ip link set {{ bridge.name }} up
          ip addr replace {{ bridge.ip }} dev {{ bridge.name }} || true
          {% endfor %}
          ip route add 10.0.5.0/24 dev virbr1 src 10.0.5.1 2>/dev/null || true
          echo "ARCHIVIRT: OVS bridge IPs restored"

    - name: Install archivirt-ovs-ip systemd service
      copy:
        dest: /etc/systemd/system/archivirt-ovs-ip.service
        content: |
          [Unit]
          Description=ARCHIVIRT - Restore OVS bridge gateway IPs
          After=openvswitch-switch.service ovsdb-server.service
          Requires=openvswitch-switch.service
          Before=libvirtd.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/archivirt-ovs-ip.sh
          RemainAfterExit=yes
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start archivirt-ovs-ip
      systemd:
        name: archivirt-ovs-ip
        daemon_reload: yes
        enabled: yes
        state: started

    # -------------------------------------------------------------------------
    # 4. dnsmasq DHCP for OVS bridges (runtime, immediate)
    # -------------------------------------------------------------------------
    - name: Kill any stale dnsmasq instances on OVS bridges
      shell: |
        for f in /var/run/dnsmasq-ovs-*.pid; do
          [ -f "$f" ] && kill $(cat "$f") 2>/dev/null || true
        done
      ignore_errors: yes

    - name: Create dnsmasq DHCP startup script
      copy:
        dest: /usr/local/bin/archivirt-ovs-dhcp.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # ARCHIVIRT - Start dnsmasq DHCP servers for OVS bridges
          # Generated by setup_ovs.yml v1.1.0
          set -e

          # Kill stale instances
          for f in /var/run/dnsmasq-ovs-*.pid; do
            [ -f "$f" ] && kill $(cat "$f") 2>/dev/null || true
            rm -f "$f"
          done

          sleep 2  # wait for bridges to be up

          {% for bridge in ovs_bridges %}
          dnsmasq \
            --interface={{ bridge.name }} \
            --bind-interfaces \
            --port=0 \
            --no-resolv \
            --dhcp-range={{ bridge.dhcp_range }} \
            --pid-file=/var/run/dnsmasq-ovs-{{ bridge.name }}.pid \
            --log-facility=/var/log/dnsmasq-ovs-{{ bridge.name }}.log \
            --log-dhcp
          echo "ARCHIVIRT: dnsmasq started on {{ bridge.name }} ({{ bridge.dhcp_range }})"
          {% endfor %}

    - name: Install archivirt-ovs-dhcp systemd service
      copy:
        dest: /etc/systemd/system/archivirt-ovs-dhcp.service
        content: |
          [Unit]
          Description=ARCHIVIRT - dnsmasq DHCP for OVS bridges
          After=archivirt-ovs-ip.service
          Requires=archivirt-ovs-ip.service

          [Service]
          Type=forking
          ExecStart=/usr/local/bin/archivirt-ovs-dhcp.sh
          PIDFile=/var/run/dnsmasq-ovs-ovs-targets.pid
          RemainAfterExit=yes
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start archivirt-ovs-dhcp
      systemd:
        name: archivirt-ovs-dhcp
        daemon_reload: yes
        enabled: yes
        state: started

    # -------------------------------------------------------------------------
    # 5. Verification
    # -------------------------------------------------------------------------
    - name: Verify all bridges are up
      command: "ip link show {{ item.name }}"
      loop: "{{ ovs_bridges }}"
      changed_when: false

    - name: Show OVS topology
      command: ovs-vsctl show
      register: ovs_topology
      changed_when: false

    - name: Confirm gateway IPs assigned
      shell: "ip addr show | grep -E '10\\.0\\.[2345]\\.1'"
      register: ip_check
      changed_when: false

    - name: Show assigned IPs
      debug:
        msg: "{{ ip_check.stdout_lines }}"

    - name: Confirm dnsmasq running on OVS bridges
      shell: "ps aux | grep dnsmasq | grep ovs | grep -v grep || echo 'WARNING: no dnsmasq found'"
      register: dnsmasq_check
      changed_when: false

    - name: Show dnsmasq status
      debug:
        msg: "{{ dnsmasq_check.stdout_lines }}"

    - name: Summary
      debug:
        msg:
          - "✅ OVS bridges ready + persistent across reboots"
          - "   ovs-targets  → 10.0.2.1/24  DHCP: 10.0.2.10-50"
          - "   ovs-monitor  → 10.0.3.1/24  DHCP: 10.0.3.10-50"
          - "   ovs-attack   → 10.0.4.1/24  DHCP: 10.0.4.10-50"
          - "   ovs-manager  → 10.0.5.1/24  DHCP: 10.0.5.10-50"
          - ""
          - "   Systemd services installed:"
          - "   → archivirt-ovs-ip.service   (bridge IPs au boot)"
          - "   → archivirt-ovs-dhcp.service (dnsmasq DHCP au boot)"
          - ""
          - "   Next step: terraform apply"

# --- patch: persist virbr1 route for archivirt-manager ---
- name: ARCHIVIRT - Persist virbr1 route for manager network
  hosts: localhost
  connection: local
  become: yes
  gather_facts: no
  tasks:
    - name: Add virbr1 route (runtime)
      command: ip route add 10.0.5.0/24 dev virbr1 src 10.0.5.1
      ignore_errors: yes

    - name: Persist virbr1 route in archivirt-ovs-ip.sh
      lineinfile:
        path: /usr/local/bin/archivirt-ovs-ip.sh
        line: "ip route add 10.0.5.0/24 dev virbr1 src 10.0.5.1 2>/dev/null || true"
        insertbefore: 'echo "ARCHIVIRT'
