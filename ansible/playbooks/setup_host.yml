# ARCHIVIRT - Host setup complet (IaC reproductible)
# Author: Yasnemanegre SAWADOGO (SPbGUPTD)
# Run once: ansible-playbook ansible/playbooks/setup_host.yml -i localhost,
- name: ARCHIVIRT - Configure host for IaC
  hosts: localhost
  connection: local
  become: yes
  tasks:

    - name: Enable passwordless sudo for archivirt
      copy:
        content: "archivirt ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/archivirt
        mode: 0440

    - name: Install nginx (serveur dépôt local)
      apt:
        name: nginx
        state: present

    - name: Créer le dossier du dépôt local
      file:
        path: /var/spool/apt-mirror/packages
        state: directory
        mode: '0755'

    - name: Configurer nginx pour servir le dépôt sur port 8080
      copy:
        dest: /etc/nginx/sites-enabled/apt-local.conf
        content: |
          server {
              listen 8080 default_server;
              root /var/spool/apt-mirror/packages;
              autoindex on;
              location / {
                  try_files $uri $uri/ =404;
              }
          }
      notify: reload nginx

    # STEP3.2 (C-5/R-1): this playbook NO LONGER downloads packages nor rebuilds the index. The former
    # tasks ran "apt-get download ... snort ..." (snort = Snort 2.9 on jammy) and unpinned versions with
    # "2>/dev/null || true", then re-indexed: they could add competing versions next to the pinned ones
    # and silently re-introduce Snort 2. The ONLY supported way to fill the mirror is
    # scripts/update_mirror.sh (non-destructive, pinned, run on the host with Internet, preparation phase).
    - name: Verify the local mirror (read-only; fails on duplicates, missing/altered files, forbidden packages)
      command: bash "{{ playbook_dir }}/../../scripts/update_mirror.sh" --verify
      changed_when: false

    - name: Read the legacy apt-mirror configuration if present
      slurp:
        src: /etc/apt/mirror.list
      register: legacy_mirror_list
      failed_when: false

    - name: Refuse an ACTIVE apt-mirror configuration that would fetch Snort 2 or unpinned engine versions
      fail:
        msg: >-
          /etc/apt/mirror.list is active and lists 'snort' (Snort 2.9 on jammy) or 'suricata' without a pinned
          version. Disable it (rename to mirror.list.disabled, see STEP3_2_QUARANTINE_PLAN.md); use update_mirror.sh.
      when:
        - legacy_mirror_list.content is defined
        - (legacy_mirror_list.content | b64decode).splitlines() | select('match', '^\\s*include-packages\\s.*\\b(snort|suricata)\\b') | list | length > 0

    - name: Installer passlib sur l'hôte (requis pour Ansible user module)
      pip:
        name: passlib
        executable: pip3
        extra_args: --user
      become: no

    - name: Démarrer nginx
      systemd:
        name: nginx
        state: started
        enabled: yes


    - name: Synchroniser les scripts install_*.sh depuis le repo vers le miroir (IaC — évite versions périmées)
      copy:
        src: "/home/archivirt/ARCHIVIRT/scripts/{{ item }}"
        dest: "/var/spool/apt-mirror/packages/{{ item }}"
        mode: '0755'
        owner: root
        group: root
      loop:
        - install_attacker.sh
        - install_monitor.sh
        - install_manager.sh
        - install_targets.sh
      loop_control:
        label: "{{ item }}"

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
